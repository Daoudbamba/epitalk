version: "3.9"

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rtc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: rtc_password
      POSTGRES_DB: rtc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtc -d rtc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtc-network

  # =============================================================================
  # Adminer (Database GUI - Development only)
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: rtc-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - rtc-network
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  rtc-network:
    driver: bridge
