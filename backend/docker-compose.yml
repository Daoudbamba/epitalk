version: "3.9"

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rtc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: rtc_password
      POSTGRES_DB: rtc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtc -d rtc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtc-network

  # =============================================================================
  # MongoDB Database (for messages)
  # =============================================================================
  mongodb:
    image: mongo:7
    container_name: rtc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: rtc
      MONGO_INITDB_ROOT_PASSWORD: rtc_password
      MONGO_INITDB_DATABASE: rtc
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtc-network

  # =============================================================================
  # Adminer (Database GUI - Development only)
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: rtc-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - rtc-network
    profiles:
      - dev

volumes:
  postgres_data:
  mongodb_data:

networks:
  rtc-network:
    driver: bridge
